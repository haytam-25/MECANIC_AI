# Comprobaciones en cada push a main y en cada pull request: tests del backend y lint + build del frontend.
# No despliega nada: el despliegue se sigue haciendo a mano en el servidor (ver MecanicAI/README.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Un push nuevo cancela la comprobación anterior de la misma rama
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MecanicAI/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Los tests no necesitan base de datos ni claves (sin backend/.env)
      - run: ./mvnw -B test

  frontend:
    name: Frontend (lint y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MecanicAI/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: MecanicAI/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
