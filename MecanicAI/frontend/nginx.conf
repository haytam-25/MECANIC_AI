# Si delante hay un proxy con HTTPS (Caddy, Cloudflare, la plataforma de hosting...), respeta su esquema
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Plantilla: al arrancar, la imagen de nginx sustituye ${NGINX_LOCAL_RESOLVERS} por el DNS de la red de
# contenedores (ver Dockerfile). Con ese DNS, nginx vuelve a buscar la IP del backend cada 10 s: al actualizar,
# el backend se recrea con otra IP y, sin esto, nginx seguiría enviando a la antigua (error 502).
resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

# Freno general contra floods en la API (los límites de uso de la IA van aparte, en el backend): por IP, 10 peticiones
# por segundo con ráfagas de hasta 40 (al abrir la app se piden varias cosas a la vez) y como mucho 20 conexiones
# abiertas a la vez (cada respuesta de la IA en streaming ocupa una). Superarlo devuelve 429 en JSON (@demasiadas).
limit_req_zone $binary_remote_addr zone=api_por_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conexiones_por_ip:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Redirecciones con ruta relativa (Location: /guias): con la URL completa saldría http:// y el puerto interno,
    # porque el HTTPS lo pone Caddy delante
    absolute_redirect off;

    # IP real del cliente: delante va Caddy (u otro proxy en la red de contenedores), así que $remote_addr sería la
    # suya y todos los usuarios compartirían el límite. Solo se cree X-Forwarded-For si llega desde una red privada;
    # Caddy no reenvía el X-Forwarded-For que mande el cliente, lo sustituye por su IP.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from fc00::/7;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Clientes lentos a propósito (slowloris): si tardan más en enviar las cabeceras o el cuerpo, se corta
    client_header_timeout 15s;
    client_body_timeout 15s;

    # Compresión de la app y de las respuestas JSON (el streaming text/event-stream no se comprime)
    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/xml;

    # API, login con Google y health check → backend. Mismo dominio que la web: así funcionan las cookies.
    location ~ ^/(api|oauth2|login/oauth2|actuator/health)(/|$) {
        limit_req zone=api_por_ip burst=40 nodelay;
        limit_req_status 429;
        limit_conn conexiones_por_ip 20;
        limit_conn_status 429;
        # Solo los 429 del propio nginx: los del backend (cupos de la IA) pasan tal cual con su mensaje
        error_page 429 = @demasiadas;

        # Con una variable, nginx resuelve el nombre con el "resolver" de arriba en vez de una sola vez al arrancar
        set $backend http://backend:8080;
        proxy_pass $backend;
        # Por defecto nginx rechaza más de 1 MB; al iniciar sesión se importa la consulta del invitado entera
        client_max_body_size 5m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Ya es la IP real del cliente (ver set_real_ip_from): se envía sola, sin la cadena que pudiera traer la petición
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        # Respuestas de la IA en streaming (Server-Sent Events): sin buffer y con tiempo de sobra
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Respuesta de los límites de arriba con el mismo formato que los errores del backend (la app muestra el mensaje)
    location @demasiadas {
        default_type application/json;
        add_header Retry-After 10 always;
        return 429 '{"code":"TOO_FAST","message":"Demasiadas peticiones seguidas. Espera unos segundos y vuelve a intentarlo."}';
    }

    # El HTML y el service worker siempre frescos; los assets con hash, caché larga
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    # La extensión .webmanifest no está en los tipos de nginx: sin esto se serviría como application/octet-stream
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Rutas de la aplicación de una sola página (las páginas de cada coche)
    location /coche/ {
        try_files /index.html =404;
    }

    # Páginas en HTML estático (/privacidad → privacidad.html, /guias/x → guias/x.html) y la portada. Lo que no existe
    # muestra la app (que enseña "página no encontrada") pero con estado 404, para que Google no la indexe
    location / {
        try_files $uri $uri.html $uri/ =404;
        error_page 404 /index.html;
    }

    # /guias/ (con barra) es la carpeta de las guías: sin esto daría 403
    location = /guias/ {
        return 301 /guias;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
    }
}
