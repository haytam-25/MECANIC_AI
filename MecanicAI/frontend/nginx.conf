# Si delante hay un proxy con HTTPS (Caddy, Cloudflare, la plataforma de hosting...), respeta su esquema
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Compresión de la app y de las respuestas JSON (el streaming text/event-stream no se comprime)
    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # API, login con Google y health check → backend. Mismo dominio que la web: así funcionan las cookies.
    location ~ ^/(api|oauth2|login/oauth2|actuator/health)(/|$) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        # Respuestas de la IA en streaming (Server-Sent Events): sin buffer y con tiempo de sobra
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # El HTML y el service worker siempre frescos; los assets con hash, caché larga
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Aplicación de una sola página: cualquier otra ruta sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
