# MecanicAI en producción (base de datos + backend + web + HTTPS):
#   cp .env.example .env   # y rellena los valores
#   docker compose up -d --build     (o: podman-compose up -d --build)
# Arranca en orden: db → backend (espera a que la BD esté lista y crea las tablas) → frontend → caddy.

# Logs de cada contenedor limitados a 10 MB para que no llenen el disco del servidor con el tiempo
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"

services:
  db:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: mecanicai
      POSTGRES_USER: mecanicai
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mecanicai -d mecanicai"]
      interval: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    environment:
      DB_URL: jdbc:postgresql://db:5432/mecanicai
      DB_USER: mecanicai
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Define GEMINI_API_KEY en .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    logging: *logging
    depends_on:
      - backend

  # HTTPS automático para tu dominio
  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN en .env (tu dominio, p. ej. mecanicai.es)}
    volumes:
      # "z": deja leer el fichero con SELinux activo (Fedora, RHEL...); en Ubuntu no hace nada
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend

volumes:
  db-data:
  caddy-data:
  caddy-config:
