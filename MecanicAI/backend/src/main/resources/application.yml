# Configuración base (segura para producción).
# En local arranca con el perfil "dev" (ver application-dev.yml y README).
spring:
  application:
    name: mecanicai
  config:
    # Permite poner las variables (GEMINI_API_KEY, GOOGLE_CLIENT_ID...) en backend/.env
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mecanicai}
    username: ${DB_USER:mecanicai}
    password: ${DB_PASSWORD:mecanicai}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    async:
      request-timeout: 5m

server:
  port: ${PORT:8080}
  # Detrás de nginx / proxy: respeta X-Forwarded-* (https, host e IP real del cliente)
  forward-headers-strategy: native
  servlet:
    session:
      # La sesión HTTP solo se usa durante el baile OAuth con Google
      timeout: 10m
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  timezone: Europe/Madrid
  # A dónde volver tras el login con Google ("/" = mismo dominio que el frontend)
  frontend-url: ${FRONTEND_URL:/}
  auth:
    # Genera uno con: openssl rand -base64 48
    jwt-secret: ${JWT_SECRET:}
    # La sesión se renueva sola mientras el usuario siga entrando (como mucho una vez al día)
    session-days: 7
    cookie-secure: ${COOKIE_SECURE:true}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  ai:
    # gemini | mock | auto (auto = gemini si hay API key, si no mock)
    provider: ${AI_PROVIDER:gemini}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      timeout: 90s
    chat:
      temperature: 0.4
      max-output-tokens: 4096
      history-messages: 20
    engines:
      # La lista de motores se guarda en caché para siempre: aquí manda la precisión (Flash) más que la velocidad
      models: ${GEMINI_ENGINES_MODELS:gemini-3.5-flash,gemini-3-flash-preview,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash}
      thinking-level: low
      # Si la IA tarda más, se ofrece escribir el motor a mano en vez de hacer esperar al usuario
      timeout: 30s
      daily-lookups-per-client: 40
      # Entre todos los invitados (cada consulta que no está en caché gasta cuota de Gemini)
      guest-daily-lookups-total: ${GUEST_DAILY_LOOKUPS_TOTAL:300}
  # Cada plan usa su lista de modelos: si el primero está saturado (habitual en la capa gratuita) se prueba el
  # siguiente. El plan PRO queda preparado para el futuro.
  plans:
    free:
      # Flash-Lite primero: es el más rápido (empieza a escribir en ~1 s) y el que más peticiones gratis tiene al día
      # (unas 500, frente a unas 20 de cada Flash). Razonamiento mínimo: responde antes y basta para estas preguntas.
      models: ${GEMINI_CHAT_MODELS:gemini-3.5-flash-lite,gemini-3.5-flash,gemini-3-flash-preview,gemini-3.1-flash-lite,gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash}
      thinking-level: minimal
      daily-messages: ${FREE_DAILY_MESSAGES:20}
      # Informes médicos por semana (de lunes a domingo)
      weekly-reports: ${FREE_WEEKLY_REPORTS:5}
    pro:
      models: ${GEMINI_PRO_MODELS:gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash}
      thinking-level: medium
      daily-messages: 300
      weekly-reports: 30
  guest:
    daily-messages: ${GUEST_DAILY_MESSAGES:5}
    daily-messages-per-ip: 20
    weekly-reports: ${GUEST_WEEKLY_REPORTS:2}
    weekly-reports-per-ip: 6
    # Entre todos los invitados: la cuota gratuita de Gemini es la misma para invitados y cuentas
    daily-messages-total: ${GUEST_DAILY_MESSAGES_TOTAL:300}
  # Los límites por conexión cuentan cada IPv4 y cada bloque /64 de IPv6 (ver ClientNetwork)
  limits:
    max-vehicles: 5
    # Al empezar la consulta número 21 se borra la más antigua
    max-conversations: 20
    # Reparaciones del diario por cuenta (entre todos sus coches)
    max-repairs: 30
    # Conversaciones de invitado que se pueden guardar en la cuenta al día
    daily-imports: 20
    chat-per-minute: 6
    lookups-per-minute: 10
